"""

# Hide Level Border (STATUS.md round 16, src/game/level_border.cpp): the
# game's palette again after the landscape (func_80009320's return; its early
# outs come here too, and do nothing then). $s3 is the drawing library.
[[patches.hook]]
func = "func_80009320"
before_vram = 0x80009588
text = """
    wa_level_border_end(rdram, ctx);
"""
