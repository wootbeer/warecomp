"""

# HUD anchoring (STATUS.md round 15, src/game/widescreen.cpp): the walker
# marks each draw-list entry as HUD or not, and resets any anchoring at the
# next entry and at the end of the walk.
[[patches.hook]]
func = "game_8005FC70"
before_vram = 0x8005FD1C
text = """
    wa_hud_entry(rdram, ctx);
"""

[[patches.hook]]
func = "game_8005FC70"
